name: Agentic Quality & Compliance Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    name: Repository Health & Doc Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Structural Documentation Linter
        run: python scripts/lint_docs.py --strict

      - name: Check Doc-to-Code Parity
        run: python scripts/check_doc_drift.py

      - name: Master Repository Health Audit
        run: python scripts/audit_repo.py
